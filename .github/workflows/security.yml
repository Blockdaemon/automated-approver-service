name: Security Scan

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 0 * * *' # every day at midnight

jobs:
  security-scan:
    uses: Blockdaemon/github-pipeline-blueprints/.github/workflows/security.yml@main
    secrets: inherit
