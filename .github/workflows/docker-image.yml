name: Docker Image

on:
  pull_request:
    paths:
      - approval-service/**
      - config.yaml
      - go.mod
      - go.sum
      - .github/workflows/docker-image.yml
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag to build and publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: iv.sepior.net
  IMAGE: iv.sepior.net/automated-approver-service

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set image tags
        id: tags
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          release_tag=""
          # PRs: amd64 only. main, v* tags, and dispatch: amd64+arm64 (qemu).
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            platforms="linux/amd64"
          else
            platforms="linux/amd64,linux/arm64"
          fi

          if [[ -n "${REQUESTED_RELEASE_TAG}" ]]; then
            if [[ ! "${REQUESTED_RELEASE_TAG}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "Invalid release tag: ${REQUESTED_RELEASE_TAG}" >&2
              exit 1
            fi

            checked_out_tag="$(git describe --tags --exact-match HEAD)"
            if [[ "${checked_out_tag}" != "${REQUESTED_RELEASE_TAG}" ]]; then
              echo "Checked out ${checked_out_tag}, expected ${REQUESTED_RELEASE_TAG}" >&2
              exit 1
            fi
            release_tag="${REQUESTED_RELEASE_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi

          {
            echo "sha=${short_sha}"
            echo "manifest=${IMAGE}:${short_sha}"
            echo "platforms=${platforms}"
            echo "release_tag=${release_tag}"
            echo "tags<<EOF"
            echo "${IMAGE}:${short_sha}"
            if [[ "${EVENT_NAME}" != "pull_request" ]]; then
              echo "${IMAGE}:latest"
            fi
            if [[ -n "${release_tag}" ]]; then
              echo "${IMAGE}:${release_tag}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # arm64 binfmt — only needed on main/tag/dispatch (PRs amd64-only).
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: approval-service/Dockerfile
          platforms: ${{ steps.tags.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=automated-approver-service
          cache-to: type=gha,mode=max,scope=automated-approver-service

      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.manifest }}"
