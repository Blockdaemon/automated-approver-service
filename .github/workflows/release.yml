name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: GOWORK=off go test ./approval-service/ -count=1

      - name: Check for known vulnerabilities
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOWORK=off govulncheck ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          out="dist/automated-approver-service-${GOOS}-${GOARCH}"
          GOWORK=off go build -trimpath -ldflags="-s -w" -o "$out" ./approval-service
          shasum -a 256 "$out" > "${out}.sha256"

      - name: Generate SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} cyclonedx-gomod app -json -std \
            -main approval-service \
            -output "dist/automated-approver-service-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts
        run: |
          base="dist/automated-approver-service-${{ matrix.goos }}-${{ matrix.goarch }}"
          cosign sign-blob --yes --bundle "${base}.bundle" "$base"
          cosign sign-blob --yes --bundle "${base}.cdx.json.bundle" "${base}.cdx.json"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
